groups:
  - name: infraestructura
    rules:
      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Uso alto de CPU"
          description: "La utilización de CPU supera 85% durante 2 minutos."

      - alert: LowAvailableMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 15
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Memoria disponible baja"
          description: "La memoria disponible está por debajo de 15%."

  - name: apm
    rules:
      - alert: HighHttpErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Tasa de error HTTP alta"
          description: "Más del 5% de las solicitudes terminan en error 5xx."

      - alert: HighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by(le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Latencia p95 alta"
          description: "La latencia p95 supera 1 segundo."
