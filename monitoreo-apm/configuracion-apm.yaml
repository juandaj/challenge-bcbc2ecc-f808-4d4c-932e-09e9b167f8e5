apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-apm-config
  labels:
    app: prometheus
data:
  apm-scrape.yml: |
    scrape_configs:
      - job_name: apm
        metrics_path: /metrics
        scrape_interval: 15s
        static_configs:
          - targets: ['app:8000']
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  labels:
    app: grafana
data:
  grafana.ini: |
    [metrics]
    enabled = true

    [api]
    enabled = true

    [users]
    allow_sign_up = false
